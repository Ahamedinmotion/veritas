[project]
name = "veritas"
version = "1.0.0"
description = "VERITAS - Deepfake Forensics Lab (INFINIA 2026 science fair)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26,<2.3",
    "scipy>=1.13",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "torch>=2.4",
    "transformers>=4.45,<5",
    "huggingface_hub>=0.25",
    "safetensors>=0.4",
    "mediapipe>=0.10.14",
    "av>=12.0",
    "soundfile>=0.12",
    "librosa>=0.10.2",
    "scikit-learn>=1.5",
    "PyWavelets>=1.6",
    "pillow-heif>=0.18",
    "onnxruntime>=1.20",
    "torchvision>=0.29",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
