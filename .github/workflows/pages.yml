# Publishes the website (the story, index.html, and the lab, lab.html) from the web/ folder to GitHub Pages:
# https://ahamedinmotion.github.io/veritas/
# GitHub Pages is a static host, so the lab there uses the online engine when one is running (web/js/config.js)
# and otherwise opens in showcase mode (the Evidence-locker exhibits show their real, saved engine reports).
# Only web/ is published: no models, no evaluation data and no research clips.
name: Website (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v5
