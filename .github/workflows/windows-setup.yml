# Fresh-install test of the one-click Windows setup, exactly as a teammate would do it:
# build VERITAS-Windows.zip, unzip it into a folder whose name has spaces and brackets, mark the files as
# "downloaded from the internet", run "1 - SETUP (run once).bat", check the Desktop shortcuts, start the engine
# the way the "VERITAS" shortcut does, and analyse Evidence-locker samples through the real HTTP API.
# Nothing is cached on purpose (no pip/uv/model cache): a cache could hide a fresh-install bug.
# Two installs run side by side: the default %USERPROFILE%\VERITAS, and a VERITAS_HOME with spaces and brackets.
name: Windows one-click setup

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  setup:
    name: setup (${{ matrix.install }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - install: default
            home: ""
          - install: spaces-and-brackets
            home: 'C:\Users\runneradmin\VERITAS lab (CI test)'
    env:
      VERITAS_CI: "1"
      DL_DIR: 'C:\Users\runneradmin\Downloads\VERITAS-Windows (1)'
    steps:
      - uses: actions/checkout@v4

      - name: Build VERITAS-Windows.zip
        shell: pwsh
        run: |
          python scripts/build_release_zip.py
          if ($LASTEXITCODE -ne 0) { throw "zip build failed" }

      - name: Unzip into a path with spaces and brackets, mark the files as downloaded
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:DL_DIR | Out-Null
          Expand-Archive -LiteralPath dist\VERITAS-Windows.zip -DestinationPath $env:DL_DIR -Force
          $root = Join-Path $env:DL_DIR 'VERITAS'
          Get-ChildItem -LiteralPath $root | Format-Table Name, Length
          foreach ($n in '1 - SETUP (run once).bat', '2 - START VERITAS.bat', 'app') {
            if (-not (Test-Path -LiteralPath (Join-Path $root $n))) { throw "zip layout: $n missing" }
          }
          # Mark of the Web, as a browser download + Explorer "Extract All" would set it (setup must remove it)
          Get-ChildItem -LiteralPath $root -Recurse -File | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $vh = if ('${{ matrix.home }}') { '${{ matrix.home }}' } else { Join-Path $env:USERPROFILE 'VERITAS' }
          if ('${{ matrix.home }}') { "VERITAS_HOME=${{ matrix.home }}" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          "VH=$vh" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SETUP_BAT=$(Join-Path $root '1 - SETUP (run once).bat')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "START_BAT=$(Join-Path $root '2 - START VERITAS.bat')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-Command uv -ErrorAction SilentlyContinue | Format-List Source

      # Explorer runs a .bat double-clicked INSIDE a zip from %TEMP%\Temp1_<zip name>.zip\..., without the other files.
      - name: Double-click inside the zip without extracting - must say "Please UNZIP" and change nothing
        shell: pwsh
        run: |
          $d = Join-Path $env:TEMP 'Temp1_VERITAS-Windows.zip\VERITAS'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item -LiteralPath $env:SETUP_BAT -Destination $d
          $bat = Join-Path $d '1 - SETUP (run once).bat'
          $o = Join-Path $env:RUNNER_TEMP 'not-extracted.txt'
          $p = Start-Process -FilePath $env:ComSpec -ArgumentList ('/d /s /c ""' + $bat + '""') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $o
          $text = Get-Content -LiteralPath $o -Raw
          $text
          if ($p.ExitCode -ne 1 -or $text -notmatch 'Please UNZIP') { throw "the not-extracted message did not appear (exit $($p.ExitCode))" }
          if (Test-Path -LiteralPath $env:VH) { throw "setup started from inside the zip: $env:VH exists" }

      - name: Run "1 - SETUP (run once).bat" (VERITAS_CI=1)
        shell: cmd
        run: |
          echo VERITAS_HOME=[%VERITAS_HOME%]  install dir=[%VH%]
          call "%SETUP_BAT%"
          if errorlevel 1 exit /b 1

      - name: Setup timings
        if: always() && env.VH != ''
        shell: pwsh
        run: python .github/scripts/setup_timings.py (Join-Path $env:VH 'setup-log.txt') '${{ matrix.install }}'

      - name: Check the install, the shortcuts and the demo clips
        shell: pwsh
        run: |
          $desk = [Environment]::GetFolderPath('Desktop')
          $w = New-Object -ComObject WScript.Shell
          foreach ($n in 'VERITAS.lnk', 'VERITAS demo clips.lnk') {
            $p = Join-Path $desk $n
            if (-not (Test-Path -LiteralPath $p)) { throw "Desktop shortcut missing: $p" }
            $s = $w.CreateShortcut($p)
            "{0} -> {1}  (icon {2})" -f $n, $s.TargetPath, $s.IconLocation
            if (-not (Test-Path -LiteralPath $s.TargetPath)) { throw "shortcut target missing: $($s.TargetPath)" }
          }
          $s = $w.CreateShortcut((Join-Path $desk 'VERITAS.lnk'))
          if ($s.TargetPath -ne (Join-Path $env:VH 'scripts\start_windows.bat')) { throw "VERITAS shortcut points to $($s.TargetPath)" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:VH 'scripts\assets\veritas.ico'))) { throw "icon missing" }
          $zi = Get-Item -LiteralPath (Join-Path $env:VH 'scripts\start_windows.bat') -Stream Zone.Identifier -ErrorAction SilentlyContinue
          if ($zi) { throw "start_windows.bat still carries the downloaded-file mark (Unblock-File did not run)" }
          $clips = Join-Path $env:VH 'demo-clips'
          Get-ChildItem -LiteralPath $clips -Recurse -File | Format-Table FullName, Length -AutoSize
          if (-not (Test-Path -LiteralPath (Join-Path $clips 'Evidence locker samples\real-video.mp4'))) { throw "locker samples not copied" }
          $n = (Get-ChildItem -LiteralPath $clips -Filter '*.mp4' -File).Count
          "research demo clips downloaded: $n of 9 (non-fatal by design)"
          if (Test-Path -LiteralPath (Join-Path $env:VH 'models\face_swap\gend_clip_int8.onnx')) { 'int8 face-swap file: present' } else { 'int8 face-swap file: MISSING (auto mode then stays on fp32)' }
          # Windows' 260-character path limit: this runner may have long paths enabled, a school laptop usually not.
          # Report the longest file path inside the install, so a long user name's headroom is known.
          $lp = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -ErrorAction SilentlyContinue).LongPathsEnabled
          $long = Get-ChildItem -LiteralPath $env:VH -Recurse -File -Force -ErrorAction SilentlyContinue | Sort-Object { $_.FullName.Length } -Descending | Select-Object -First 1
          $rel = $long.FullName.Length - $env:VH.Length
          "longest path: $($long.FullName.Length) chars ($rel after the install folder): $($long.FullName)"
          "LongPathsEnabled on this runner: $lp. Default install C:\Users\<name>\VERITAS stays under 260 for user names up to $(259 - 17 - $rel) characters."

      - name: Start the engine like the Desktop shortcut, then analyse samples through the API
        shell: pwsh
        run: |
          # auto mode on this 16 GB runner must pick fp32 (the benchmarked setting)
          & .github/scripts/engine_check.ps1 -Label auto -ExpectFaceSwap fp32

      # The int8 RAM fallback is what "auto" picks on a laptop with less than 12 GB of RAM. The runner has 16 GB, so the
      # threshold is raised for this one engine start (test hook in server/config.py); the same API checks must pass.
      - name: Auto mode on a low-RAM laptop (threshold forced) - int8 face-swap detector, same API checks
        if: matrix.install == 'default'
        shell: pwsh
        env:
          VERITAS_TEST_AUTO_INT8_BELOW_GB: "64"
        run: |
          & .github/scripts/engine_check.ps1 -Label auto-int8 -ExpectFaceSwap int8

      # A teammate who is unsure will double-click SETUP again: it must repair without downloading anything twice.
      - name: Run "1 - SETUP" a second time (repair) - keeps every download, self-test must pass again
        if: matrix.install == 'spaces-and-brackets'
        shell: cmd
        run: |
          call "%SETUP_BAT%"
          if errorlevel 1 exit /b 1

      - name: Repair run - timings, nothing downloaded twice
        if: matrix.install == 'spaces-and-brackets'
        shell: pwsh
        run: |
          python .github/scripts/setup_timings.py (Join-Path $env:VH 'setup-log.txt') 'second run (repair)'
          $log = Get-Content -LiteralPath (Join-Path $env:VH 'setup-log.txt') -Raw
          $again = [regex]::Matches($log, '(?m)^\s+downloading .*$|: downloading from .*$') | ForEach-Object { $_.Value.Trim() }
          if ($again) { $again; throw "the repair run downloaded models or clips again" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:VH 'setup-log-previous.txt'))) { throw "the first setup log was not kept" }
          'repair run: no model or clip downloaded again'

      # (copied to a folder without brackets first: upload-artifact treats some characters in paths as glob syntax)
      - name: Collect setup and server logs
        if: always()
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'veritas-logs'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          if ($env:VH) {
            foreach ($f in 'setup-log.txt', 'setup-log-previous.txt', 'demo-clips\README.txt') {
              $p = Join-Path $env:VH $f
              if (Test-Path -LiteralPath $p) { Copy-Item -LiteralPath $p -Destination (Join-Path $d ($f -replace '\\', '_')) }
            }
          }
          Get-ChildItem -LiteralPath $d | Format-Table Name, Length

      - name: Upload setup and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-windows-logs-${{ matrix.install }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/veritas-logs/

      - name: Upload the tested zip
        if: matrix.install == 'default'
        uses: actions/upload-artifact@v4
        with:
          name: VERITAS-Windows-zip
          path: dist/VERITAS-Windows.zip
          retention-days: 14
